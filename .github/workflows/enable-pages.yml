name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions: write-all

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at docs/ on this branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          body="{\"source\":{\"branch\":\"$REF\",\"path\":\"/docs\"}}"
          mkdir -p debug
          {
            echo "REF=$REF"
            echo "--- existing site ---"
            gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1
            echo "--- create/update ---"
            if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
              printf '%s' "$body" | gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" \
                -H 'Accept: application/vnd.github+json' --input - 2>&1
            else
              printf '%s' "$body" | gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
                -H 'Accept: application/vnd.github+json' --input - 2>&1
            fi
            echo "--- final site ---"
            gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1
          } | tee debug/pages-api.txt
      - name: Publish diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Pages setup diagnostic" --body-file debug/pages-api.txt
      - name: Fail if Pages is still missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url'
